name: Verify

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('mise.toml', 'go.sum', '.golangci.yml') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - run: mise run verify
      - run: mise run smoke
      - name: Prove the image boots
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          id="$(scripts/image.sh build chill-mcp:pr pr "$SHA")"
          scripts/image.sh prove "$id" pr

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked semantic-release
        run: npm ci --prefix .github/release --ignore-scripts --no-audit --no-fund

      - name: Smoke-test semantic-release
        run: node .github/release/smoke.mjs

      - name: Scan pushed range
        if: ${{ !cancelled() }}
        uses: chill-institute/.github/.github/actions/scan@04bad7d160da50b0509abfd5ff2e382aaf7d1aef # v1.0.0
