name: Main

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('mise.toml', 'go.sum', '.golangci.yml') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - run: mise run verify
      - run: mise run smoke

  release:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: release-${{ github.repository }}-main
      cancel-in-progress: false
    environment:
      name: publish
      deployment: false
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      IMAGE_NAME: ghcr.io/chill-institute/chill-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mint a chill-ci token for this repository
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CHILL_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHILL_CI_APP_PRIVATE_KEY }}
          owner: chill-institute
          repositories: chill-mcp
          permission-contents: write
      - name: Plan the release
        id: plan
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          semantic_version: 25.0.9
          dry_run: true
          extra_plugins: |
            conventional-changelog-conventionalcommits@9.3.1
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
      - name: Resolve the version to publish
        id: version
        env:
          PLANNED_TAG: ${{ steps.plan.outputs.new_release_git_tag }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          tag="$PLANNED_TAG"
          # A re-run after a failed publish finds the tag already on HEAD.
          [ -n "$tag" ] || tag="$(git tag --points-at HEAD --list 'v*' --sort=-version:refname | head -n1)"
          if [ -z "$tag" ]; then
            {
              echo "publish=false"
              echo "version=candidate"
            } >> "$GITHUB_OUTPUT"
            echo "No release for this commit; nothing to publish." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          {
            echo "publish=true"
            echo "tag=$tag"
            echo "version=${tag#v}"
          } >> "$GITHUB_OUTPUT"

      # The pushed image is this build: it is proven before any tag exists and
      # published by image ID, never rebuilt.
      - name: Build the image
        id: image
        env:
          SHA: ${{ github.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: echo "id=$(scripts/image.sh build chill-mcp:release "$VERSION" "$SHA")" >> "$GITHUB_OUTPUT"
      - name: Prove the image boots
        env:
          IMAGE_ID: ${{ steps.image.outputs.id }}
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/image.sh prove "$IMAGE_ID" "$VERSION"

      - name: Tag and draft the release
        id: semantic
        if: ${{ steps.version.outputs.publish == 'true' }}
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          semantic_version: 25.0.9
          extra_plugins: |
            conventional-changelog-conventionalcommits@9.3.1
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
      - name: Confirm the release matches the proven version
        if: ${{ steps.version.outputs.publish == 'true' }}
        env:
          PUBLISHED: ${{ steps.semantic.outputs.new_release_published }}
          NEW_TAG: ${{ steps.semantic.outputs.new_release_git_tag }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$PUBLISHED" = "true" ]; then
            [ "$NEW_TAG" = "$RELEASE_TAG" ] || { echo "::error::released $NEW_TAG but proved $RELEASE_TAG"; exit 1; }
          else
            git fetch --force --tags origin
            git tag --points-at HEAD | grep -Fx "$RELEASE_TAG" || { echo "::error::$RELEASE_TAG is not on HEAD"; exit 1; }
          fi

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: ${{ steps.version.outputs.publish == 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the proven image
        id: publish
        if: ${{ steps.version.outputs.publish == 'true' }}
        env:
          SHA: ${{ github.sha }}
          IMAGE_ID: ${{ steps.image.outputs.id }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          major="${VERSION%%.*}"; minor="${VERSION%.*}"
          for tag in "$VERSION" "$minor" "$major" latest main "sha-${SHA::12}"; do
            docker tag "$IMAGE_ID" "$IMAGE_NAME:$tag"
            docker push "$IMAGE_NAME:$tag"
          done
          digest_ref="$(docker image inspect "$IMAGE_ID" --format '{{join .RepoDigests "\n"}}' | grep -E "^$IMAGE_NAME@sha256:[0-9a-f]{64}$" | head -n1)"
          [ -n "$digest_ref" ] || { echo "no digest reference for $IMAGE_NAME:$VERSION"; exit 1; }
          {
            echo "ref=$digest_ref"
            echo "digest=${digest_ref#*@}"
          } >> "$GITHUB_OUTPUT"
          printf '## Published %s\n\n~~~\n%s:%s\n%s\nimage ID %s\n~~~\n' "$RELEASE_TAG" "$IMAGE_NAME" "$VERSION" "$digest_ref" "$IMAGE_ID" >> "$GITHUB_STEP_SUMMARY"
      - name: Attest build provenance
        if: ${{ steps.version.outputs.publish == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Record the image and publish the release
        if: ${{ steps.version.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE_REF: ${{ steps.publish.outputs.ref }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > "$RUNNER_TEMP/body.md"
          # Idempotent: drop any earlier image section before appending this one.
          awk '/^## Image$/ {exit} {print}' "$RUNNER_TEMP/body.md" | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > "$RUNNER_TEMP/notes.md"
          printf '\n\n## Image\n\n~~~\n%s:%s\n%s\n~~~\n' "$IMAGE_NAME" "$VERSION" "$IMAGE_REF" >> "$RUNNER_TEMP/notes.md"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md" --draft=false

      - name: Mint a chill-ci token for chill-engine
        id: engine
        if: ${{ steps.version.outputs.publish == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CHILL_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHILL_CI_APP_PRIVATE_KEY }}
          owner: chill-institute
          repositories: chill-engine
          permission-actions: write
      - name: Deploy through chill-engine
        if: ${{ steps.version.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ steps.engine.outputs.token }}
          IMAGE_REF: ${{ steps.publish.outputs.ref }}
        run: |
          set -euo pipefail
          dispatch_id="$GITHUB_REPOSITORY-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh workflow run deploy-mcp.yml -R chill-institute/chill-engine --ref main -f image="$IMAGE_REF" -f dispatch_id="$dispatch_id"
          run_id=""
          for _ in $(seq 1 12); do
            sleep 10
            run_id="$(gh run list -R chill-institute/chill-engine -w deploy-mcp.yml -L 10 --json databaseId,displayTitle -q "[.[] | select(.displayTitle | endswith(\" $dispatch_id\"))] | first | .databaseId // empty")"
            [ -n "$run_id" ] && break
          done
          [ -n "$run_id" ] || { echo "::error::could not find the dispatched deploy run $dispatch_id"; exit 1; }
          echo "Deploy run: https://github.com/chill-institute/chill-engine/actions/runs/$run_id" >> "$GITHUB_STEP_SUMMARY"
          gh run watch "$run_id" -R chill-institute/chill-engine --exit-status
