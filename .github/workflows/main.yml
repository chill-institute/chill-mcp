name: Main

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/chill-institute/chill-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('mise.toml', 'go.sum', '.golangci.yml') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - run: mise run verify
      - run: mise run smoke
      - name: Build the release candidate
        env:
          SHA: ${{ github.sha }}
        run: |
          docker build \
            --build-arg "VERSION=main-${SHA::12}" \
            --build-arg "COMMIT=$SHA" \
            --label "org.opencontainers.image.revision=$SHA" \
            -t chill-mcp:release-candidate .
      - name: Prove the exact payload boots
        run: |
          docker run -d --name candidate --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            -e CHILL_ENGINE_BASE_URL=http://127.0.0.1:9 -p 127.0.0.1:7100:7100 chill-mcp:release-candidate
          for _ in $(seq 1 50); do docker exec candidate /chill-mcp health 2>/dev/null && break; sleep 0.2; done
          docker exec candidate /chill-mcp health
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:7100/mcp -H 'Content-Type: application/json' -d '{}')"
          [ "$code" = "401" ] || { echo "expected 401 without bearer, got $code"; exit 1; }
          docker rm -f candidate
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the verified image
        id: publish
        env:
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          tag="$IMAGE_NAME:$SHA-$RUN_ID-$RUN_ATTEMPT"
          docker tag chill-mcp:release-candidate "$tag"
          docker tag chill-mcp:release-candidate "$IMAGE_NAME:main"
          docker push "$tag"
          docker push "$IMAGE_NAME:main"
          digest_ref="$(docker image inspect "$tag" --format '{{join .RepoDigests "\n"}}' | grep -E "^$IMAGE_NAME@sha256:[0-9a-f]{64}$" | head -n1)"
          [ -n "$digest_ref" ] || { echo "no digest reference for $tag"; exit 1; }
          echo "ref=$digest_ref" >> "$GITHUB_OUTPUT"
          {
            echo '## Published image'
            echo
            echo '```'
            echo "$digest_ref"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mint a chill-ci token for chill-engine
        id: releaser
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CHILL_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHILL_CI_APP_PRIVATE_KEY }}
          owner: chill-institute
          repositories: chill-engine
          permission-actions: write

      - name: Deploy through chill-engine
        env:
          GH_TOKEN: ${{ steps.releaser.outputs.token }}
          IMAGE_REF: ${{ steps.publish.outputs.ref }}
        run: |
          set -euo pipefail
          before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run deploy-mcp.yml -R chill-institute/chill-engine --ref main -f image="$IMAGE_REF"
          run_id=""
          for _ in $(seq 1 12); do
            sleep 10
            # shellcheck disable=SC2016 # $before is a jq variable
            run_id="$(gh run list -R chill-institute/chill-engine -w deploy-mcp.yml -L 5 --json databaseId,createdAt -q --arg before "$before" '[.[] | select(.createdAt >= $before)] | first | .databaseId // empty')"
            [ -n "$run_id" ] && break
          done
          [ -n "$run_id" ] || { echo "::error::could not find the dispatched deploy run"; exit 1; }
          echo "Deploy run: https://github.com/chill-institute/chill-engine/actions/runs/$run_id" >> "$GITHUB_STEP_SUMMARY"
          gh run watch "$run_id" -R chill-institute/chill-engine --exit-status
