name: Bug report
description: Report a problem with the MCP server
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    id: tool-call
    attributes:
      label: Tool call
      description: Which tool and arguments?
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options:
        - stdio
        - hosted
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Result
      description: What happened, and what should have happened instead? Include sanitized tool output; never include tokens or `Authorization` headers.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `chill-mcp version`, or "hosted".
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client
      placeholder: Claude Code, Cursor, other
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and architecture
      placeholder: macOS arm64
