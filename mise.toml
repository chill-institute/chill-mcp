[tools]
node = "24.22.1"
actionlint = "1.7.12"
go = "1.27.3"
zizmor = "1.31.1"

[env]
GOWORK = "off"

[settings]
experimental = true

[hooks]
postinstall = "mise run hooks"

[tasks.fmt]
description = "Format Go sources with the formatters in .golangci.yml"
run = "go tool golangci-lint fmt"

[tasks.lint]
description = "Run static analysis and the gofmt and goimports checks"
run = "go tool golangci-lint run ./..."

[tasks."mod:check"]
description = "Ensure go.mod and go.sum are tidy without mutating them"
run = "go mod tidy -diff"

[tasks.test]
description = "Run unit and protocol tests"
run = "go test ./..."

[tasks.security]
description = "Run dependency vulnerability scan against the online Go vulnerability database"
run = "go tool govulncheck ./..."

[tasks.actions]
description = "Validate and audit GitHub Actions"
run = """
actionlint
zizmor --min-severity medium .github/workflows
"""

[tasks."release:smoke"]
description = "Check the shared release rules with a dry semantic-release run"
run = [
  "npm ci --prefix .github/release --ignore-scripts --no-audit --no-fund",
  "node .github/release/smoke.mjs"
]

[tasks.smoke]
description = "Boot the http server on a loopback port and prove health plus the bearer gate"
run = """
set -eu
export CHILL_LISTEN_HOST=127.0.0.1 CHILL_LISTEN_PORT="${CHILL_LISTEN_PORT:-7199}" CHILL_ENGINE_BASE_URL=http://127.0.0.1:9
go build -o ./chill-mcp ./cmd/chill-mcp
./chill-mcp http & pid=$!
trap 'kill "$pid" 2>/dev/null || true' EXIT
for _ in $(seq 1 50); do ./chill-mcp health 2>/dev/null && break; sleep 0.1; done
./chill-mcp health
code="$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://127.0.0.1:$CHILL_LISTEN_PORT/" -H 'Content-Type: application/json' -d '{}')"
[ "$code" = "401" ] || { echo "expected 401 without bearer, got $code" >&2; exit 1; }
printf 'smoke ok\\n'
"""

[tasks."docker:build"]
description = "Build the release image locally through the release build path"
run = "scripts/image.sh build chill-mcp:local dev \"$(git rev-parse HEAD)\""

[tasks."docker:prove"]
description = "Boot the local image read-only and prove version, health, and the bearer gate"
depends = ["docker:build"]
run = "PROOF_PORT=\"${PROOF_PORT:-7198}\" scripts/image.sh prove chill-mcp:local dev"

[tasks.hooks]
description = "Install repo git hooks"
run = """
hooks_dir="$(git rev-parse --git-path hooks)"
mkdir -p "$hooks_dir"
printf '#!/bin/sh\\nexec mise run hooks:pre-commit\\n' > "$hooks_dir/pre-commit"
printf '#!/bin/sh\\nexec mise run hooks:pre-push\\n' > "$hooks_dir/pre-push"
chmod +x "$hooks_dir/pre-commit" "$hooks_dir/pre-push"
"""

[tasks."hooks:pre-commit"]
description = "Format staged Go files and restage them"
run = """
staged="$(git diff --cached --name-only --diff-filter=ACMR -- '*.go')"
[ -n "$staged" ] || exit 0
printf '%s\n' "$staged" | while IFS= read -r file; do
  go tool goimports -w "$file"; gofmt -w "$file"; git add -- "$file"
done
"""

[tasks."hooks:pre-push"]
description = "Run the verification gate before push"
run = "mise run verify"

[tasks.verify]
description = "Run module, lint, test, and workflow checks"
depends = ["mod:check", "lint", "test", "actions"]
